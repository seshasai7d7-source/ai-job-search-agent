name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build and verify Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag job-agent-api:ci .

      - name: Check image contents
        run: |
          docker run --rm --entrypoint sh job-agent-api:ci -c '
            set -eu
            if find /app -type f \( -name ".env" -o -name "*.pdf" -o -name "*.db" \) -print -quit | grep -q .; then
              echo "Image contains an excluded environment, PDF, or database file." >&2
              exit 1
            fi
            test ! -e /app/tests
            test -z "$(find /app/data -mindepth 1 -maxdepth 1 -print -quit)"
          '

      - name: Start container
        run: |
          docker volume create job-agent-data-ci
          docker run --detach \
            --name job-agent-api-ci \
            --publish 127.0.0.1:8000:8000 \
            --volume job-agent-data-ci:/app/data \
            job-agent-api:ci

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs job-agent-api-ci
          exit 1

      - name: Verify Docker health status
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' job-agent-api-ci)"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker inspect --format '{{json .State.Health}}' job-agent-api-ci
              exit 1
            fi
            sleep 1
          done
          docker inspect --format '{{json .State.Health}}' job-agent-api-ci
          exit 1

      - name: Verify container runs as non-root
        run: |
          docker exec job-agent-api-ci sh -c '
            test "$(id -u)" -ne 0
            whoami
          '

      - name: Stop container
        if: always()
        run: |
          if docker inspect job-agent-api-ci >/dev/null 2>&1; then
            docker stop job-agent-api-ci
            docker rm job-agent-api-ci
          fi
